aid: sequoia-capital
name: Sequoia Capital
description: >-
  Sequoia Capital is one of the world's leading venture capital firms, founded
  by Don Valentine in 1972 and headquartered at 2800 Sand Hill Road in Menlo
  Park, California. Sequoia partners with founders from idea to IPO and beyond,
  investing across seed, early, and growth stages, and has backed transformative
  companies including Apple, Google, Oracle, Cisco, NVIDIA, PayPal, YouTube,
  Airbnb, Stripe, WhatsApp, Instagram, DoorDash, Snowflake, and Reddit. Its stated
  mission is to "help the daring build legendary companies," with a current focus
  on artificial intelligence and AI agents, autonomous systems, fintech,
  developer tools and infrastructure, healthcare, and consumer technology.
  Following its 2024 restructuring, Sequoia operates primarily across the US and
  Europe, while its former India/SEA and China arms became the independent firms
  Peak XV Partners and HongShan. This profile tracks Sequoia's identity and its
  portfolio graph across the API Evangelist network.
